{{- if eq (include "gatekeeper.secretManager" .) "true" }}
{{- $project := required "secrets.secretManager.project is required when secrets.source=secretManager" .Values.secrets.secretManager.project }}
# Module C5: each workload mounts ONLY its own secrets, as files, straight from Secret
# Manager (GKE's CSI driver, authenticated as the pod's Workload Identity). Rotating a
# secret is adding a version in Secret Manager, then a rolling restart.
{{- range $component, $files := dict "backend" .Values.secrets.secretManager.backend "setup" .Values.secrets.secretManager.setup }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "gatekeeper.name" (dict "root" $ "component" $component) }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- if eq $component "setup" }}
  annotations:   # the setup hook runs before upgrades; its mount must exist by then
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file, $secret := $files }}
      - resourceName: "projects/{{ $project }}/secrets/{{ $secret }}/versions/latest"
        path: "{{ $file }}"
      {{- end }}
{{- end }}
{{- end }}

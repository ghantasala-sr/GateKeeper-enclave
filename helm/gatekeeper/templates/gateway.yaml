{{- if .Values.gateway.enabled }}
{{- $gw := include "gatekeeper.name" (dict "root" . "component" "gateway") }}
{{- $appHost := regexReplaceAll ":[0-9]+$" (urlParse (include "gatekeeper.appUrl" .)).host "" }}
{{- $authHost := regexReplaceAll ":[0-9]+$" (urlParse (include "gatekeeper.authUrl" .)).host "" }}
# One way in, routed by hostname and path:
#   <app host>   /api/*  -> backend   (prefix stripped: the backend serves /chat, /me, /auth/...)
#                /*      -> frontend
#   <auth host>  /*      -> keycloak
{{- if .Values.gateway.envoyProxy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gw }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ .Values.gateway.envoyProxy.serviceName }}
        type: {{ .Values.gateway.envoyProxy.serviceType }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled" .Values.gateway.className }}
  {{- if .Values.gateway.envoyProxy.enabled }}
  infrastructure:
    parametersRef: { group: gateway.envoyproxy.io, kind: EnvoyProxy, name: {{ $gw }} }
  {{- end }}
  {{- with .Values.gateway.addresses }}
  addresses: {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.port }}
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: {{ required "gateway.tls.preSharedCert is required when gateway.tls.enabled" .Values.gateway.tls.preSharedCert | quote }}
    {{- else }}
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gatekeeper.name" (dict "root" . "component" "app") }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  parentRefs: [{ name: {{ $gw }} }]
  hostnames: [{{ $appHost | quote }}]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
      backendRefs: [{ name: {{ include "gatekeeper.name" (dict "root" . "component" "backend") }}, port: 8000 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ include "gatekeeper.name" (dict "root" . "component" "frontend") }}, port: 3000 }]
{{- if .Values.keycloak.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gatekeeper.name" (dict "root" . "component" "auth") }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  parentRefs: [{ name: {{ $gw }} }]
  hostnames: [{{ $authHost | quote }}]
  rules:
    - backendRefs: [{ name: {{ include "gatekeeper.name" (dict "root" . "component" "keycloak") }}, port: 8080 }]
{{- end }}
{{- end }}

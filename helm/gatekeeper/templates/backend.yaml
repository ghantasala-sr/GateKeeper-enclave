{{- $name := include "gatekeeper.name" (dict "root" . "component" "backend") }}
# Its own identity: on GKE, Workload Identity maps it to a Google service account for Vertex AI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false   # it never calls the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  {{- include "gatekeeper.rollingUpdate" . | nindent 2 }}
  selector:
    matchLabels: {{- include "gatekeeper.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gatekeeper.podLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # A config change alters this hash, which changes the pod template: a rolling restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: {{ add .Values.drainSeconds 30 }}
      {{- include "gatekeeper.topologySpread" (dict "root" . "component" "backend") | nindent 6 }}
      securityContext: {{- include "gatekeeper.podSecurityContext" . | nindent 8 }}
      # Start only once setup has created the schema and seeded the tenants, instead of
      # crash-looping until it has (the setup hook runs after the release's objects exist).
      initContainers:
        - name: wait-for-schema
          image: {{ include "gatekeeper.image" (dict "root" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "gatekeeper.containerSecurityContext" . | nindent 12 }}
          {{- include "gatekeeper.backendSecretEnv" . | nindent 10 }}
          command:
            - python
            - -c
            - |
              import asyncio, sys, time
              import asyncpg
              from app.config import settings
              async def seeded():
                  conn = await asyncpg.connect(settings.app_database_url, timeout=5)
                  try:
                      return await conn.fetchval("SELECT count(*) FROM tenants") > 0
                  finally:
                      await conn.close()
              while True:
                  try:
                      if asyncio.run(seeded()):
                          sys.exit(0)
                      print("tenants not seeded yet")
                  except Exception as e:
                      print(f"database not ready: {type(e).__name__}: {e}")
                  time.sleep(3)
      containers:
        - name: backend
          image: {{ include "gatekeeper.image" (dict "root" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "gatekeeper.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
            {{- if .Values.metrics.enabled }}
            - { name: metrics, containerPort: 9090 }
            {{- end }}
          {{- include "gatekeeper.backendSecretEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- include "gatekeeper.gracefulStop" . | nindent 10 }}
          # Model load takes ~10s; allow up to 60s before the other probes start.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          # Can it serve? Checks the database. Failing only removes the pod from traffic.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          # Is the process stuck? Never the database: an outage must not restart every pod.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
      {{- if eq (include "gatekeeper.secretManager" .) "true" }}
      volumes: {{- include "gatekeeper.secretsVolume" (dict "root" . "component" "backend") | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "gatekeeper.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  selector: {{- include "gatekeeper.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }

# Gatekeeper chart defaults. Environment files layer on top of this:
#   values-local.yaml          kind (helm/gatekeeper/values-local.yaml)
#   config/values-enclave.yaml the GCP Enclave
#
# No secret ever goes in a values file. The chart only REFERENCES Secrets that
# already exist in the namespace (see `secrets` below): locally they come from
# helm/local-secrets.sh, in the Enclave from Secret Manager.

image:
  registry: ""          # e.g. us-central1-docker.pkg.dev/enclave-gk/gatekeeper; "" = images loaded straight onto the nodes (kind)
  tag: ""               # REQUIRED: the Gatekeeper release to deploy
  pullPolicy: IfNotPresent
  backend: { repository: gatekeeper-backend }
  frontend: { repository: gatekeeper-frontend }

# What users type into the browser. Every login redirect, the token issuer and
# Keycloak's own hostname are built from these, so the browser and the backend
# always agree on them.
publicUrls:
  app: ""               # REQUIRED: the frontend; the API is served under <app>/api
  auth: ""              # REQUIRED: Keycloak

llm:
  provider: vertex-gemini     # the Enclave's only model
  vertex:
    project: ""               # "" = chat answers 503 "not configured"
    location: global
    model: gemini-3.8-flash
    timeoutSeconds: 20          # per attempt of a Vertex AI call
    retryAttempts: 4            # 429/500/503/504 (shared Gemini quota), with exponential backoff

secrets:
  # kubernetes:    the Kubernetes Secrets named below (kind: helm/local-secrets.sh)
  # secretManager: files mounted from Secret Manager by GKE's CSI driver (the Enclave);
  #                Keycloak still uses its Kubernetes Secret (it reads env, not files)
  source: kubernetes
  secretManager:
    project: ""
    mountPath: /var/run/secrets/gatekeeper
    # file name (= the app setting it fills) -> Secret Manager secret
    backend:
      app_db_password: gk-app-db-password
      session_secret: gk-session-secret
      token_signing_key_b64: gk-token-signing-key-b64
      token_verify_keys_b64: gk-token-verify-keys-b64
      okta_client_secret: gk-acme-client-secret
    setup:
      owner_password: gk-owner-password
      app_db_password: gk-app-db-password
  # Each entry names an existing Secret; the keys are fixed.
  dbOwner: gatekeeper-db-owner     # OWNER_PASSWORD, APP_DB_PASSWORD   (setup Job and in-cluster Postgres only)
  dbApp: gatekeeper-db-app         # APP_DB_PASSWORD                   (backend)
  app: gatekeeper-app              # SESSION_SECRET, TOKEN_SIGNING_KEY_B64 (backend)
  keycloak: gatekeeper-keycloak    # KC_BOOTSTRAP_ADMIN_PASSWORD, ACME_CLIENT_SECRET, ACME_TEST_PASSWORD, GLOBEX_TEST_PASSWORD
  # The acme OIDC client secret the backend presents to the IdP.
  oidcClientSecret: { name: gatekeeper-keycloak, key: ACME_CLIENT_SECRET }

database:
  name: gatekeeper
  port: 5432
  ownerUser: gatekeeper_owner     # Cloud SQL: the user Terraform creates
  host: ""                        # external database (Cloud SQL private IP); ignored when inCluster.enabled
  inCluster:
    enabled: false                # true = a lab-only Postgres StatefulSet (kind)
    image: pgvector/pgvector:pg17
    storage: 1Gi
    storageClassName: ""          # "" = the cluster's default StorageClass

# How long a terminating pod keeps serving while the load balancer takes it out of rotation.
drainSeconds: 15

setup:
  serviceAccount:
    annotations: {}               # GKE: Workload Identity, to read the owner password from Secret Manager

backend:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  serviceAccount:
    annotations: {}               # GKE: iam.gke.io/gcp-service-account for Workload Identity (Vertex AI)

frontend:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

keycloak:
  enabled: true                   # false = the environment brings its own IdP
  image: quay.io/keycloak/keycloak:26.2.5
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }

gateway:
  enabled: true
  className: ""                   # REQUIRED when enabled: "envoy" on kind, "gke-l7-rilb" (internal) on GKE
  port: 80
  # Envoy Gateway only: a fixed name for Envoy's Service (kind's CoreDNS rewrite points at it).
  envoyProxy:
    enabled: false
    serviceName: gatekeeper-gateway
    serviceType: ClusterIP
  # GKE: a reserved internal IP for the load balancer (a NamedAddress, created by Terraform).
  addresses: []
  # GKE's load balancer health-checks "/" unless told otherwise; the backend and Keycloak
  # answer elsewhere (/ready, and /health/ready on Keycloak's management port).
  gkeHealthChecks: false
  # GKE: how long the load balancer waits for the backend (default 30s). A chat answer can
  # take several model calls, each with retries. 0 = leave GKE's default.
  gkeBackendTimeoutSeconds: 0

# Prometheus metrics on the backend's separate port 9090 (never routed by the Gateway).
metrics:
  enabled: true
  # GKE: Managed Service for Prometheus scrapes them (a PodMonitoring resource).
  podMonitoring: false
  # Who may scrape :9090 (GKE: the gmp-system collectors).
  scrapers: []

networkPolicy:
  enabled: true
  # Where the Gateway's proxies run, so only they may reach backend/frontend/keycloak.
  # Envoy Gateway: its pods. GKE's managed Gateway: the proxy-only subnet (ipBlock).
  gatewayPeers: []
  # How the backend reaches Keycloak at publicUrls.auth (through the Gateway).
  backendToAuth: []
  # How the backend and setup Job reach an external database (Cloud SQL private IP range).
  databaseEgress: []
  # Anything else the backend may call (GKE: Google APIs' restricted VIP for Vertex AI).
  backendExtraEgress: []

suite: secrets from Secret Manager, never Kubernetes Secrets (Module C5)
release:
  name: gk
values:
  - ../values-local.yaml
set:
  secrets.source: secretManager
  secrets.secretManager.project: enclave-gk
templates:
  - backend.yaml
  - setup-job.yaml
  - secretproviderclass.yaml
  - configmap.yaml
tests:
  - it: gives the backend no Kubernetes Secret reference at all
    template: backend.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - lengthEqual: { path: "spec.template.spec.containers[0].envFrom", count: 1 }   # the ConfigMap only
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_DATABASE_URL }
          any: true
      - equal: { path: "spec.template.spec.volumes[0].csi.driver", value: secrets-store-gke.csi.k8s.io }
      - equal: { path: "spec.template.spec.volumes[0].csi.volumeAttributes.secretProviderClass", value: gk-backend }

  - it: mounts only the backend's own secrets in the backend
    template: secretproviderclass.yaml
    documentSelector: { path: metadata.name, value: gk-backend }
    asserts:
      - matchRegex: { path: spec.parameters.secrets, pattern: "projects/enclave-gk/secrets/gk-session-secret/versions/latest" }
      - notMatchRegex: { path: spec.parameters.secrets, pattern: "owner-password" }

  - it: runs setup as its own identity, with the owner password as a file
    template: setup-job.yaml
    documentSelector: { path: kind, value: Job }
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: gk-setup }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: OWNER_PASSWORD }
          any: true
      - equal: { path: "spec.template.spec.volumes[0].csi.volumeAttributes.secretProviderClass", value: gk-setup }

  - it: insists on the project
    template: secretproviderclass.yaml
    set:
      secrets.secretManager.project: ""
    asserts:
      - failedTemplate: { errorMessage: "secrets.secretManager.project is required when secrets.source=secretManager" }

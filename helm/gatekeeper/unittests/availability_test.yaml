suite: zero-downtime rollouts and drains
release:
  name: gk
values:
  - ../values-local.yaml
templates:
  - backend.yaml
  - frontend.yaml
  - configmap.yaml
  - pdb.yaml
  - setup-job.yaml
  - keycloak.yaml
tests:
  - it: never removes a serving pod before its replacement is ready
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate
          value: { maxSurge: 1, maxUnavailable: 0 }
        documentSelector: { path: kind, value: Deployment, matchMany: true, skipEmptyTemplates: true }

  - it: keeps serving while the load balancer drains a terminating pod
    template: backend.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: [sleep, "15"]
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 45 }

  - it: spreads replicas across zones and nodes
    template: backend.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: "spec.template.spec.topologySpreadConstraints[0].topologyKey", value: topology.kubernetes.io/zone }

  - it: lets a drain take only one replica at a time (multi-replica components only)
    template: pdb.yaml
    asserts:
      - hasDocuments: { count: 1 }      # backend has 2 replicas; frontend 1 (a PDB would block drains)
      - equal: { path: spec.maxUnavailable, value: 1 }
      - equal: { path: metadata.name, value: gk-backend }

  - it: migrates before an upgrade's new pods start (and after a fresh install's database exists)
    template: setup-job.yaml
    asserts:
      - equal: { path: "metadata.annotations['helm.sh/hook']", value: "post-install,pre-upgrade" }

  - it: restarts only what a release changes (no version label on pod templates)
    set:
      image.tag: "9.9.9"
    asserts:
      - notExists: { path: "spec.template.metadata.labels['app.kubernetes.io/version']" }
        documentSelector: { path: kind, value: Deployment, matchMany: true, skipEmptyTemplates: true }
      - notExists: { path: "spec.template.metadata.labels['helm.sh/chart']" }
        documentSelector: { path: kind, value: Deployment, matchMany: true, skipEmptyTemplates: true }

  - it: rolls Keycloak safely too (surge, then drain)
    template: keycloak.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: spec.strategy.rollingUpdate, value: { maxSurge: 1, maxUnavailable: 0 } }
      - exists: { path: "spec.template.spec.containers[0].lifecycle.preStop" }

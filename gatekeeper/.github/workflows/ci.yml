name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gatekeeper_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatekeeper_owner -d gatekeeper"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries for SAML (xmlsec)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxmlsec1-dev pkg-config

      - name: Install Python dependencies
        # CPU-only PyTorch keeps the install small; embeddings run on CPU anyway.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Write CI configuration
        # Throwaway values for an ephemeral database; no real IdP or model credentials are needed.
        run: |
          {
            echo "MIGRATION_DATABASE_URL=postgresql://gatekeeper_owner:ci-owner-password@localhost:5432/gatekeeper"
            echo "APP_DB_PASSWORD=ci-app-password"
            echo "APP_DATABASE_URL=postgresql://gatekeeper_app:ci-app-password@localhost:5432/gatekeeper"
            echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            python -m scripts.gen_signing_key
          } > ../.env

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Migrate, seed, and ingest
        run: |
          python -m scripts.migrate
          python -m scripts.seed
          python -m app.rag.ingest

      - name: Run tests
        run: python -m pytest -q -p no:warnings

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

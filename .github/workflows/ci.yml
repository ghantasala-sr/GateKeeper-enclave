name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Both database owners the app must work with: a superuser (local Docker) and a
    # Cloud SQL-like owner with neither SUPERUSER nor BYPASSRLS (compose/postgres-init).
    name: Backend tests (${{ matrix.owner }} owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        owner: [superuser, cloudsql-like]
    defaults:
      run:
        working-directory: gatekeeper/backend
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        working-directory: .
        run: |
          if [ "${{ matrix.owner }}" = superuser ]; then
            docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=gatekeeper_owner \
              -e POSTGRES_PASSWORD=ci-owner-password -e POSTGRES_DB=gatekeeper pgvector/pgvector:pg17
          else
            docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=postgres_admin -e POSTGRES_PASSWORD=ci-admin-password \
              -e GATEKEEPER_OWNER_PASSWORD=ci-owner-password \
              -v "$PWD/compose/postgres-init:/docker-entrypoint-initdb.d:ro" pgvector/pgvector:pg17
          fi
          for i in $(seq 1 30); do docker exec pg pg_isready -d gatekeeper -U gatekeeper_owner -h 127.0.0.1 && break; sleep 2; done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gatekeeper/backend/requirements.txt

      - name: Install system libraries for SAML (xmlsec)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxmlsec1-dev pkg-config

      - name: Install Python dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Write CI configuration
        # Throwaway values for an ephemeral database; no IdP or model credentials needed.
        run: |
          {
            echo "MIGRATION_DATABASE_URL=postgresql://gatekeeper_owner:ci-owner-password@localhost:5432/gatekeeper"
            echo "APP_DB_PASSWORD=ci-app-password"
            echo "APP_DATABASE_URL=postgresql://gatekeeper_app:ci-app-password@localhost:5432/gatekeeper"
            echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            python -m scripts.gen_signing_key
          } > ../.env

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Migrate, seed, and ingest
        run: |
          python -m scripts.migrate
          python -m scripts.seed
          python -m app.rag.ingest

      - name: Run tests
        run: python -m pytest -q -p no:warnings

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gatekeeper/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gatekeeper/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  chart:
    name: Helm chart (lint, unit tests, render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Install helm-unittest v1.2.1
        # Helm 4 can't verify plugins installed from Git; the version is pinned instead.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false
      - name: Lint
        run: helm lint helm/gatekeeper -f helm/gatekeeper/values-local.yaml
      - name: Unit tests
        run: helm unittest -f 'unittests/*_test.yaml' helm/gatekeeper
      - name: Render for kind
        run: helm template gk helm/gatekeeper -f helm/gatekeeper/values-local.yaml > /dev/null
      - name: Package (realm files must be inside)
        run: |
          helm package helm/gatekeeper -d /tmp
          tar tzf /tmp/gatekeeper-*.tgz | grep -q 'files/realms/acme-realm.json'

  terraform:
    name: Terraform (fmt, validate) and the zero-egress plan check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
      - name: Format
        run: terraform fmt -check -recursive terraform
      - name: Validate
        run: |
          for dir in terraform/bootstrap terraform/envs/enclave; do
            terraform -chdir=$dir init -backend=false -input=false >/dev/null
            terraform -chdir=$dir validate
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Plan check catches every way out
        run: pip install pytest && cd proof && python -m pytest -q test_check_terraform_plan.py

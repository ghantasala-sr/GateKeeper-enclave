# A8: Postgres as a StatefulSet with its own persistent disk.
#
# A Deployment's pods are interchangeable and get random names; a database needs
# the opposite: one stable identity (postgres-0) and a disk that follows it. The
# volumeClaimTemplate creates a PersistentVolumeClaim (data-postgres-0) that the
# StatefulSet never deletes, even when the pod or the StatefulSet itself is deleted.
#
# Lab only: the Enclave uses private Cloud SQL instead (Part B). Its password
# comes from the db-owner Secret (make-secrets.sh).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gatekeeper
  labels: { app: postgres }
spec:
  serviceName: postgres-headless   # gives the pod a stable DNS name: postgres-0.postgres-headless
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      terminationGracePeriodSeconds: 30   # let Postgres shut down cleanly before it's killed
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: gatekeeper_owner }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-owner, key: POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: gatekeeper }
            # A subdirectory of the mount: some disks have a lost+found at their root,
            # and initdb refuses a non-empty directory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:                 # only receive traffic once it accepts connections
            exec: { command: ["pg_isready", "-U", "gatekeeper_owner", "-d", "gatekeeper"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]   # one node at a time
        storageClassName: standard     # kind's local-path provisioner; GKE would use a persistent disk
        resources:
          requests: { storage: 1Gi }
---
# Clients use this stable name and virtual IP, exactly as before.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gatekeeper
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
# The StatefulSet's governing Service: headless (no virtual IP), so each pod gets
# its own DNS record (postgres-0.postgres-headless.gatekeeper.svc).
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: gatekeeper
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - port: 5432

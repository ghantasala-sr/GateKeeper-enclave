# A6: one way in. A Gateway (Envoy, installed from Envoy Gateway v1.9.2) listens
# on port 8088 and routes by hostname and path:
#
#   gatekeeper.localhost        /api/*  -> backend:8000  (the /api prefix is stripped)
#                               /*      -> frontend:3000
#   auth.gatekeeper.localhost   /*      -> keycloak:8080
#
# Reach it from the laptop with:
#   kubectl port-forward -n envoy-gateway-system svc/gatekeeper-gateway 8088:8088
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gatekeeper-proxy
  namespace: gatekeeper
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: gatekeeper-gateway   # a fixed name, so CoreDNS can point at it
        type: ClusterIP            # kind has no cloud load balancer; we port-forward
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: gatekeeper
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef: { group: gateway.envoyproxy.io, kind: EnvoyProxy, name: gatekeeper-proxy }
  listeners:
    - name: http
      protocol: HTTP
      port: 8088
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: gatekeeper
spec:
  parentRefs: [{ name: web }]
  hostnames: [gatekeeper.localhost]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      filters:
        # The backend's routes have no /api prefix (/chat, /me, /auth/..., /scim/v2/...).
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
      backendRefs: [{ name: backend, port: 8000 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: frontend, port: 3000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: gatekeeper
spec:
  parentRefs: [{ name: web }]
  hostnames: [auth.gatekeeper.localhost]
  rules:
    - backendRefs: [{ name: keycloak, port: 8080 }]

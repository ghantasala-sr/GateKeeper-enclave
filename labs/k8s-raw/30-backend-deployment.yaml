# A4: Gatekeeper's backend as a Deployment of 2 identical pods.
#
# Settings are plain env values here so the pods start; A5 moves them into a
# ConfigMap and a Secret, and adds health probes and resource limits.
# SESSION_SECRET and TOKEN_SIGNING_KEY_B64 are placeholders: the backend starts
# and serves /health, but logins need real values (A5) and Keycloak (A6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gatekeeper
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }     # which pods this Deployment owns
  template:
    metadata:
      labels: { app: backend }        # must match the selector above
    spec:
      containers:
        - name: backend
          image: gatekeeper-backend:local
          imagePullPolicy: IfNotPresent   # use the image kind loaded; never pull
          ports:
            - containerPort: 8000
          env:
            - { name: APP_DATABASE_URL, value: "postgresql://gatekeeper_app:lab-only-app@postgres:5432/gatekeeper" }
            # The app refuses to start without this, though only the setup scripts use it.
            # The running API should never hold the owner's password: fixed in A5.
            - { name: MIGRATION_DATABASE_URL, value: "postgresql://gatekeeper_owner:lab-only-owner@postgres:5432/gatekeeper" }
            - { name: LLM_PROVIDER, value: vertex-gemini }
            - { name: SESSION_SECRET, value: placeholder-until-a5 }
            - { name: TOKEN_SIGNING_KEY_B64, value: placeholder-until-a5 }

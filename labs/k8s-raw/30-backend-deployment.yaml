# A4/A5: Gatekeeper's backend as a Deployment of 2 identical pods.
#
# Settings come from Kubernetes (A5): backend-config (ConfigMap) and
# backend-secrets (Secret, from make-secrets.sh). The owner's password is NOT
# here: only Postgres and the setup Job get the db-owner Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gatekeeper
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }     # which pods this Deployment owns
  template:
    metadata:
      labels: { app: backend }        # must match the selector above
    spec:
      containers:
        - name: backend
          image: gatekeeper-backend:local
          imagePullPolicy: IfNotPresent   # use the image kind loaded; never pull
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          env:
            # Shared with Keycloak, so it lives in keycloak-secrets: one value, two readers.
            - name: OKTA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-secrets, key: ACME_CLIENT_SECRET } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }   # what the scheduler reserves on a node
            limits: { memory: 1Gi }                  # above this the container is OOMKilled
          # Loading the embedding model takes a while: allow up to 60s before the
          # other probes start, instead of a liveness probe killing a slow start.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          # Can it serve? Checks the database. Failing only removes the pod from traffic.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
          # Is the process stuck? Deliberately does NOT check the database: a DB outage
          # would otherwise restart every pod, which can't fix the DB and adds a slow start.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
